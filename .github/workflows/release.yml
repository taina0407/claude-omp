name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Check the tag matches the version
        run: |
          version="$(bun -e 'console.log((await import("./src/version.ts")).VERSION)')"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: bun run build
      - name: Smoke-test the linux binary
        run: ./dist/omp-task-linux-x64 --version
      - name: Release notes from the changelog
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; if (index($0, v)) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/omp-task-* dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --notes-file notes.md $flags
